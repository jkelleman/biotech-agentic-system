# AegisCSR Agentic System Configuration
# Production-ready settings for Clinical Study Report & Safety Narrative Automation

project:
  name: "AegisCSR"
  domain: "Metabolic Dysfunction-Associated Steatohepatitis (MASH / NASH)"
  phase: "Phase IIb"
  regulatory_standard: "FDA 21 CFR Part 11 & CDISC"

models:
  primary: "gpt-4o"
  validator: "gpt-4o"
  extractor: "gpt-4o-mini"
  deidentifier: "gpt-4o-mini"

hyperparameters:
  temperature: 0.1
  max_tokens: 1500
  loop_limit: 5

cdisc_standards:
  demographics: "ADSL"
  adverse_events: "ADAE"
  laboratory_data: "ADLB"

evaluations:
  min_compliance_score: 0.90
  observability_provider: "LangSmith"

security:
  encryption_algorithm: "AES-256 (Fernet)"
  strip_pii: true
  enable_hitl: true
  hitl_required_roles:
    - "Medical Monitor"
    - "Principal Investigator"
