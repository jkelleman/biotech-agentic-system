<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <!-- Sterile Background -->
  <rect width="800" height="200" fill="#f8fafc" />
  
  <!-- Subtle Scientific Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="1" />
    </pattern>
    <linearGradient id="helix-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#grid)" />
  
  <!-- Sterile border -->
  <rect x="10" y="10" width="780" height="180" fill="none" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Abstract Scientific/Graph Element on Left -->
  <!-- DATA.IN Node -->
  <circle cx="80" cy="100" r="6" fill="#0d9488" />
  <circle cx="80" cy="100" r="12" fill="none" stroke="#0d9488" stroke-width="1" stroke-dasharray="2 2" />
  <text x="80" y="80" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">DATA.IN</text>
  
  <!-- AGNT.EXEC Node -->
  <circle cx="160" cy="60" r="5" fill="#334155" />
  <text x="160" y="45" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">AGNT.EXEC</text>
  
  <!-- VAL.JUDGE Node -->
  <circle cx="160" cy="140" r="5" fill="#334155" />
  <text x="160" y="158" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">VAL.JUDGE</text>
  
  <!-- REPT.OUT Node -->
  <circle cx="240" cy="100" r="6" fill="#0284c7" />
  <circle cx="240" cy="100" r="12" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="2 2" />
  <text x="240" y="80" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">REPT.OUT</text>
  
  <!-- Connection Lines -->
  <line x1="80" y1="100" x2="160" y2="60" stroke="#cbd5e1" stroke-width="1" />
  <line x1="80" y1="100" x2="160" y2="140" stroke="#cbd5e1" stroke-width="1" />
  <line x1="160" y1="60" x2="240" y2="100" stroke="#cbd5e1" stroke-width="1" />
  <line x1="160" y1="140" x2="240" y2="100" stroke="#cbd5e1" stroke-width="1" />
  <line x1="160" y1="60" x2="160" y2="140" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3" />
  
  <!-- Dynamic helix motif on the far left -->
  <path d="M 30,50 Q 45,100 30,150" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-opacity="0.3"/>
  <path d="M 45,50 Q 30,100 45,150" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="33" y1="70" x2="42" y2="70" stroke="#64748b" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="37" y1="100" x2="38" y2="100" stroke="#64748b" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="42" y1="130" x2="33" y2="130" stroke="#64748b" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Sterile Vertical Divider -->
  <line x1="290" y1="40" x2="290" y2="160" stroke="#e2e8f0" stroke-width="1" />

  <!-- Clean Typography -->
  <text x="320" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a" letter-spacing="-0.5px">BIOTECH AGENTIC SYSTEM</text>
  <text x="320" y="115" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="500" fill="#0d9488" letter-spacing="1px">ORCHESTRATION / EVALUATION / GOVERNANCE</text>
  <text x="320" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Production-grade clinical safety reporting &amp; validation framework.</text>

  <!-- Status / Technical Indicators -->
  <rect x="650" y="25" width="125" height="18" rx="3" fill="#f1f5f9" />
  <circle cx="660" cy="34" r="3" fill="#10b981" />
  <text x="670" y="37" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="8" font-weight="700" fill="#475569" letter-spacing="0.5px">STABLE // VERIFIED</text>
</svg>